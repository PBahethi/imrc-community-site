name: Validate community website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/app.js && node --test tests/site.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: public-website
          path: site
